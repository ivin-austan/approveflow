services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: approveflow
      POSTGRES_USER: approveflow
      POSTGRES_PASSWORD: approveflow
    ports:
      - "5432:5432"
    volumes:
      - approveflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approveflow -d approveflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  approveflow-postgres:
